name: Deploy on LocalStack

on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  step-up:
    name: Deploy and test the step-up flow
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install lstk
        run: |
          npm install -g @localstack/lstk
          lstk setup aws --force --non-interactive

      - name: Install dependencies
        run: make install

      - name: Build the Lambda functions and the web app
        run: make build

      - name: Start LocalStack
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: make start

      - name: Deploy the stacks
        run: make deploy

      - name: Run tests
        run: make test

      - name: Show LocalStack logs
        if: failure()
        run: lstk logs | tail -300
